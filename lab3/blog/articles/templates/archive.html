{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Архив статей</title>
</head>
<body>
    <div class="header">
        <img src="{% static 'img/logo.png' %}"
             alt="Логотип блога"
             height="30">
    </div>

    <div class="archive">
        {% for post in posts %}
            <div class="one-post">
                <h2 class="post-title">{{ post.title }}</h2>

                <div class="article-info">
                    <div class="article-author">
                        {{ post.author.username }}
                    </div>

                    <div class="article-created-date">
                        {{ post.created_date }}
                    </div>
                </div>

                <p class="article-text">{{ post.get_excerpt }}</p>
            </div>
        {% empty %}
            <p>В блоге пока нет статей.</p>
        {% endfor %}
    </div>
</body>
</html>
