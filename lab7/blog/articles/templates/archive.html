{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Архив статей</title>
	<link rel="stylesheet" href="{% static 'css/article.css' %}">
</head>
<body class="archive">
    <div class="header">
    <img src="{% static 'img/logo.png' %}" alt="Логотип блога">

    <div class="header-links">
        {% include 'auth_links.html' %}
    </div>
</div>
    </div>

    <div class="archive">
	<div class="archive">
    {% if user.is_authenticated %}
        <div class="archive-actions">
            <a href="{% url 'create_post' %}">Написать статью</a>
        </div>
    {% endif %}
        {% for post in posts %}
    <div class="one-post">
        <div class="post-heading">
            <h2 class="post-title">
                <a href="{% url 'get_article' article_id=post.id %}">
                    {{ post.title }}
                </a>
            </h2>

            <button
                type="button"
                class="fold-button"
                aria-expanded="true"
            >Свернуть</button>
        </div>

        <div class="article-info">
            <div class="article-author">
                {{ post.author.username }}
            </div>

            <div class="article-created-date">
                {{ post.created_date }}
            </div>
        </div>

        <p class="article-text">{{ post.get_excerpt }}</p>
    </div>
{% empty %}
    <p>В блоге пока нет статей.</p>
{% endfor %}
    </div>
	
	<script src="{% static 'js/helloworld.js' %}"></script>
    <script src="{% static 'js/fold-post.js' %}"></script>
</body>
</html>
